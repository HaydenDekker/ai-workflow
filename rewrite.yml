---
type: specs.openrewrite.org/v1beta/recipe
name: com.hdekker.ai-workflow.phase4.6.4-update-database-config-scan-paths
displayName: Phase 4.6.4 — Update DatabaseConfig package scans to adapter/outbound/persistence
description: |
  Change the two string literals in DatabaseConfig.java from
  "com.hdekker.ai_workflow.database" to
  "com.hdekker.ai_workflow.adapter.outbound.persistence".
  One is in @EnableJpaRepositories(basePackages = ...), the other in
  entityManagerFactory().setPackagesToScan(...).

recipeList:
  - org.openrewrite.text.ReplaceText:
      filePattern: src/main/java/com/hdekker/ai_workflow/config/DatabaseConfig.java
      oldValue: com.hdekker.ai_workflow.database
      newValue: com.hdekker.ai_workflow.adapter.outbound.persistence

---
type: specs.openrewrite.org/v1beta/recipe
name: com.hdekker.ai-workflow.phase4.rest-move-and-rename
displayName: Phase 4.4 — Move rest/* to adapter/inbound/rest/* and rename controllers
description: |
  Move all REST types from rest.* into adapter/inbound/rest.*.
  Controllers land in adapter/inbound/rest/controller/ and DTOs in
  adapter/inbound/rest/dto/.

  How it works:
    1. ChangePackage (recursive:true) moves rest/*.java to adapter/inbound/rest/
       and rest/dto/*.java to adapter/inbound/rest/dto/. The recursive flag
       preserves subpackage structure — imports like
       com.hdekker.ai_workflow.rest.dto.X become
       com.hdekker.ai_workflow.adapter.inbound.rest.dto.X (correct!).
       Test files follow automatically.

    2. ChangeType renames controllers (AgentRestController → AgentController,
       etc.) and moves them into the controller/ subpackage.

    3. ChangeType renames test classes to match.

recipeList:
  # Step 1: Move ALL rest/* to adapter/inbound/rest/
  #
  # recursive:true preserves subpackage structure:
  #   rest/*.java      → adapter/inbound/rest/
  #   rest/dto/*.java  → adapter/inbound/rest/dto/
  # Test files follow automatically.
  # All imports across the codebase are updated.

  - org.openrewrite.java.ChangePackage:
      oldPackageName: com.hdekker.ai_workflow.rest
      newPackageName: com.hdekker.ai_workflow.adapter.inbound.rest
      recursive: true

  # Step 2: Rename controllers (ChangeType)
  # Moves source files to controller/ subpackage and updates all references.

  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.hdekker.ai_workflow.adapter.inbound.rest.AgentRestController
      newFullyQualifiedTypeName: com.hdekker.ai_workflow.adapter.inbound.rest.controller.AgentController

  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.hdekker.ai_workflow.adapter.inbound.rest.ObservabilityRestController
      newFullyQualifiedTypeName: com.hdekker.ai_workflow.adapter.inbound.rest.controller.ObservabilityController

  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.hdekker.ai_workflow.adapter.inbound.rest.ScannerRestController
      newFullyQualifiedTypeName: com.hdekker.ai_workflow.adapter.inbound.rest.controller.ScannerController

  # Step 3: Rename test classes (ChangeType)

  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.hdekker.ai_workflow.adapter.inbound.rest.AgentRestControllerTest
      newFullyQualifiedTypeName: com.hdekker.ai_workflow.adapter.inbound.rest.controller.AgentControllerTest

  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.hdekker.ai_workflow.adapter.inbound.rest.ObservabilityRestControllerTest
      newFullyQualifiedTypeName: com.hdekker.ai_workflow.adapter.inbound.rest.controller.ObservabilityControllerTest

---
type: specs.openrewrite.org/v1beta/recipe
name: com.hdekker.ai-workflow.phase4.5.pipeline-migrate
displayName: Phase 4.5 — Migrate pipeline/* classes to adapter.outbound.llm and config
description: |
  Move remaining pipeline classes that were missed in the initial package assessment.
  These contain LLM adapters and configuration still referenced by the new application layer.

  Package mapping (source → target):
    pipeline/LLMAdapter.java                    → adapter.outbound.llm/LLMAdapter.java
    pipeline/llmadapter/LLMAdapterFactory.java  → adapter.outbound.llm/LLMAdapterFactory.java
    pipeline/llmadapter/LLMReducerAdapter.java  → adapter.outbound.llm/LLMReducerAdapter.java
    pipeline/llmadapter/MapAgentLLMAdapter.java → adapter.outbound.llm/MapAgentLLMAdapter.java
    pipeline/llmadapter/SplitterLLMAdapter.java → adapter.outbound.llm/SplitterLLMAdapter.java
    pipeline/AgentConfiguration.java            → config/AgentConfiguration.java
    pipeline/management/AgentRestoreOnStartup.java → config/AgentRestoreOnStartup.java
    pipeline/management/DynamicAgentManagerConfiguration.java → config/DynamicAgentManagerConfiguration.java

  Import updates (cross-package references):
    application.pipeline.AgentConfigurator:
      com.hdekker.ai_workflow.pipeline.LLMAdapter
        → com.hdekker.ai_workflow.adapter.outbound.llm.LLMAdapter
      com.hdekker.ai_workflow.pipeline.llmadapter.LLMAdapterFactory
        → com.hdekker.ai_workflow.adapter.outbound.llm.LLMAdapterFactory

    pipeline.AgentConfiguration:
      com.hdekker.ai_workflow.pipeline.LLMAdapter
        → com.hdekker.ai_workflow.adapter.outbound.llm.LLMAdapter

  Cleanup:
    Delete duplicate pipeline/SplittableStrategy.java (application.pipeline.SplittableStrategy
    is the canonical version already moved in Phase 3).

recipeList:
  # Step 1: Move pipeline.llmadapter/* → adapter.outbound.llm/*
  - org.openrewrite.java.ChangePackage:
      oldPackageName: com.hdekker.ai_workflow.pipeline.llmadapter
      newPackageName: com.hdekker.ai_workflow.adapter.outbound.llm

  # Step 2: Move pipeline.management/* → config/*
  - org.openrewrite.java.ChangePackage:
      oldPackageName: com.hdekker.ai_workflow.pipeline.management
      newPackageName: com.hdekker.ai_workflow.config

  # Step 3: Move pipeline/LLMAdapter.java → adapter.outbound.llm/LLMAdapter.java
  # Cross-package move — update the type so all references resolve to new location
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.hdekker.ai_workflow.pipeline.LLMAdapter
      newFullyQualifiedTypeName: com.hdekker.ai_workflow.adapter.outbound.llm.LLMAdapter

  # Step 4: Move pipeline/AgentConfiguration.java → config/AgentConfiguration.java
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.hdekker.ai_workflow.pipeline.AgentConfiguration
      newFullyQualifiedTypeName: com.hdekker.ai_workflow.config.AgentConfiguration

  # Step 5: Update imports in application/pipeline/AgentConfigurator.java
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.hdekker.ai_workflow.pipeline.LLMAdapter
      newFullyQualifiedTypeName: com.hdekker.ai_workflow.adapter.outbound.llm.LLMAdapter

  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.hdekker.ai_workflow.pipeline.llmadapter.LLMAdapterFactory
      newFullyQualifiedTypeName: com.hdekker.ai_workflow.adapter.outbound.llm.LLMAdapterFactory

  # Step 6: Update imports in app/pipeline/AgentBuilder.java
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: com.hdekker.ai_workflow.pipeline.SplittableStrategy
      newFullyQualifiedTypeName: com.hdekker.ai_workflow.application.pipeline.SplittableStrategy

  # Step 7: Delete duplicate pipeline/SplittableStrategy.java
  - org.openrewrite.java.DeleteFile:
      filePattern: "src/main/java/com/hdekker/ai_workflow/pipeline/SplittableStrategy.java"

  # Step 8: Import hygiene
  - org.openrewrite.java.RemoveUnusedImports
  - org.openrewrite.java.OrderImports
