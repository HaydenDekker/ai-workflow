spring:
  application:
    name: ai-workflow
  ai:
    ollama:
      chat:
        options:
          model: gemma3:4b
          read-timeout: 60s
          connection-timeout: 60s
  datasource:
    driver-class-name: org.h2.Driver #org.postgresql.Driver
    url: jdbc:h2:mem:testdb #jdbc:postgresql://localhost:5432/test-db
    username: app_user
    password: mysecretpassword
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

scanner:
  url: file:src/test/resources/test-files
