spring:
  application:
    name: ai-workflow
  ai:
    chat:
      client:
        enabled: false
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/mydb
    username: app_user
    password: mysecretpassword
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
app:
  ai:
    endpoint: http://127.0.0.1:11434
    model: qwen3-16k:latest 
    #gemma3:4b
    #endpoint: http://192.168.2.108:11434
    #model: gemma3:27b
scanner:
  url: file:${EXTERNAL_CONFIG_DIR}
  
# user configured space. pre-packaged prompts will be copied here first. see src/main/resources/prompt-chains
prompt-config:
  predefinedPromptFilePath: /test/prompts
