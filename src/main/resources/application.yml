server:
  port: ${PORT:8080}

logging:
  level:
    org.atmosphere: warn

spring:
  application:
    name: ai-workflow
  autoconfigure:
    exclude:
      - org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration
      - org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  ai:
    chat:
      client:
        enabled: false
    openai:
      api-key: no_key_required
app:
    database:
      url: jdbc:sqlite:/tmp/ai-workflow.db
    ai:
      # Model validation occurs at runtime, not during startup
      #endpoint: http://127.0.0.1:11434
      #model: qwen3-16k:latest 
      #gemma3:4b
      endpoint: http://192.168.2.108:8080
      model: gemma3:27b
    observability:
      endpoint: http://192.168.2.108:8080
      model: gemma3:27b
      polling-interval: 60000
      warn-after-hours: 1
      health-timeout: 5000
management:
  endpoints:
    web:
      exposure:
        include: metrics
  metrics:
    tags:
      app: ai-workflow

ai-scanner:
  # Minimum seconds between consecutive file emissions.
  # Gives the downstream LLM pipeline time to process each file
  # before the next one arrives. Set to 0 for fast-scanning agents.
  emission-delay-seconds: 20

# Directory where LLM output is persisted and counted.
ai.workflow.output.directory: ${EXTERNAL_CONFIG_DIR:default}

# user configured space. pre-packaged prompts will be copied here first. see src/main/resources/prompt-chains
prompt-config:
  predefinedPromptFilePath: /test/prompts

# Vaadin/Hilla configuration
vaadin:
  launch-browser: true
  allowed-packages: com.vaadin,org.vaadin,com.hdekker
