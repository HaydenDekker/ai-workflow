spring:
  application:
    name: ai-workflow
  ai:
    chat:
      client:
        enabled: false
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/mydb
    username: app_user
    password: mysecretpassword
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
app:
  ai:
    endpoint: http://127.0.0.1:11434
    model: gemma3:4b
    #endpoint: http://192.168.2.108:11434
    #model: gemma3:27b
scanner:
  url: file:${EXTERNAL_CONFIG_DIR}
  output-folder: /Users/hayde/OneDrive/Documents/2025/10 Oct/AI Tests
  
prompt-config:
  chain:
    - 
      event: FILE_SYS_HASH_CHANGED_EVENT
      title: SOLID_NON_COMPLIANCE
      body: |
        Given the code below, identify any non-compliances to SOLID principals.
        You might not have external context for some classes so the assessment should just reason about the immediate code. 
        \n\r ---------- \n\r 
      outputStructure: |
        Output json, as 
          [{
           className:String, 
           compliance:NO, 
           principle:String, 
           task:String, 
           reason:String
          }, ... etc
          ]
         A single item must be encaptulated in an array.
         If there are no non-compliances output just an empty array.
    -
      event: PROMPT_RESPONSE_EVENT_SOLID_NON_COMPLIANCE
      title: PRIORITY_ORDER
      body: |
        Given this SOLID non-compliance assessment, define a priority for the rectification of the issue.
        A large issue should have a an impact weight of 3, while a small issue 1. 
        To determine priortyWeight,
        - 1 if relevant to external infrastructure adapters, such as database repositories, rest controllers or any thirdparty tool making IO requests.
        - 2 if issues in function of the core application layer.
        - 3 if issues in interfaces between adapters and core.
      outputStructure: |
        Provide response in the following json format,
          {
            priorityWeight: Number 1 .. 3
            priotyRationale: String,
          }
          If there are no responses, respond with an empty list.
          If there is only one respone, make sure its wrapped in a list.

